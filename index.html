<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- [페이지 상단] 카페 헤더 정보 -->
    <header class="header">
      <div class="logo" role="img" aria-label="카페 로고">☕</div>
      <h1 class="title">바이브 카페</h1>
      <p class="subtitle">당신의 하루에 바이브를 더하다</p>
    </header>

    <!-- [탭 메뉴] 주문하기 / 주문 내역 -->
    <nav class="tab-menu" role="tablist">
      <button type="button" class="tab-btn active" id="tab-order" role="tab" aria-selected="true" aria-controls="order-tab-content">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tab-history" role="tab" aria-selected="false" aria-controls="history-tab-content">
        📋 주문 내역 <span id="order-count-badge" class="badge">0</span>
      </button>
    </nav>

    <!-- [1. 주문하기 탭 내용] -->
    <section id="order-tab-content" class="tab-content">
      <!-- [주문서 폼] novalidate 속성으로 브라우저 기본 유효성 검사 비활성화 (JS에서 직접 처리 예정) -->
      <form id="order-form" novalidate>
      <!-- 1. 이름 (필수, text) -->
      <div class="form-group">
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" required placeholder="이름을 입력하세요">
      </div>

      <!-- 2. 전화번호 (tel) -->
      <div class="form-group">
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone" placeholder="010-0000-0000">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div class="form-group">
        <label for="beverage-select">음료 선택</label>
        <select id="beverage-select" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="latte" data-price="4000">카페라떼 4,000원</option>
          <option value="mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
        </select>
      </div>

      <!-- 4. 사이즈 (라디오) -->
      <div class="form-group">
        <fieldset>
          <legend>사이즈</legend>
          <div class="radio-group">
            <input type="radio" id="size-s" name="size" value="S" data-price="0">
            <label for="size-s">S +0원</label>

            <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
            <label for="size-m">M +500원</label>

            <input type="radio" id="size-l" name="size" value="L" data-price="1000">
            <label for="size-l">L +1,000원</label>
          </div>
        </fieldset>
      </div>

      <!-- 5. 추가 옵션 (체크박스) -->
      <div class="form-group">
        <fieldset>
          <legend>추가 옵션</legend>
          <div class="checkbox-group">
            <input type="checkbox" id="option-shot" name="options" value="shot" data-price="500">
            <label for="option-shot">샷 추가 +500원</label>

            <input type="checkbox" id="option-cream" name="options" value="cream" data-price="500">
            <label for="option-cream">크림 추가 +500원</label>

            <input type="checkbox" id="option-syrup" name="options" value="syrup" data-price="300">
            <label for="option-syrup">시럽 추가 +300원</label>

            <input type="checkbox" id="option-decaf" name="options" value="decaf" data-price="0">
            <label for="option-decaf">디카페인 +0원</label>
          </div>
        </fieldset>
      </div>

      <!-- 6. 수량 (number, 최소 1, 최대 10, 기본값 1) -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 (textarea) -->
      <div class="form-group">
        <label for="customer-requests">요청사항</label>
        <textarea id="customer-requests" name="requests" rows="4" placeholder="요청사항을 입력해주세요"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 (주문하기 버튼 바로 위) -->
      <div id="price-display-area" class="price-display">
        예상 금액: <span id="total-price">0</span>원
      </div>

      <!-- 9 & 10. 버튼 영역 (주문하기 / 다시 작성) -->
      <div class="button-group">
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지가 나올 빈 영역 (처음에는 숨김) -->
    <div id="order-confirmation" class="order-confirmation hidden" style="display: none;"></div>
  </section>

  <!-- [2. 주문 내역 탭 내용] -->
  <section id="history-tab-content" class="tab-content hidden">
    <!-- 주문 내역 목록이 동적으로 들어갈 영역 -->
    <div id="order-list" class="order-list"></div>

    <!-- 주문 내역이 없을 때 표시되는 안내 문구 -->
    <div id="empty-history-message" class="empty-history-message">
      아직 주문 내역이 없어요 ☕
    </div>

    <!-- 총 주문 금액 요약 및 전체 삭제 버튼 영역 -->
    <div id="order-summary-area" class="order-summary-area hidden">
      <p id="total-orders-summary" class="total-orders-summary">총 주문 금액: 0원 (0건)</p>
      <button type="button" id="clear-all-orders-btn" class="clear-all-btn">내역 모두 지우기</button>
    </div>
  </section>
</div>

  <!-- Supabase JS v2 라이브러리 CDN 연결 (script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
